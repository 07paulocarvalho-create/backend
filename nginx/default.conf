server {
    listen 80;
    server_name _;

    # DNS interno do Docker: os endereços dos containers são consultados de novo
    # se eles forem recriados, em vez de ficarem fixos desde a inicialização
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3000;
    set $frontend http://frontend:80;

    # Proxy reverso: requisições para /api vão para o backend (o prefixo /api é removido)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo o resto vai para o frontend
    location / {
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
